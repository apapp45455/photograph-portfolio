name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint (JS / CSS / HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: html-validate
        run: npm run lint:html

  gallery:
    name: Gallery manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Deep mode decodes every image with sharp, so a manifest that was never
      # regenerated after an image changed fails here instead of in the browser.
      - name: Check js/gallery-data.json against images on disk
        run: npm run check:gallery:deep

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js starts `python3 -m http.server` itself.
      - name: Run tests
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Serve the site
        run: |
          python3 -m http.server 8931 --bind 127.0.0.1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8931/ > /dev/null && exit 0
            sleep 1
          done
          echo "Static server did not come up on port 8931"
          exit 1

      - name: Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8931/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [lint, gallery, e2e, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "A CI job finished with: $result"
              exit 1
            fi
          done
          echo "All CI jobs succeeded."
