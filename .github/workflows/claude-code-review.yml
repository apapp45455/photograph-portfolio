name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

# A new push replaces the in-flight review instead of stacking comments.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Review the diff
    # Dependency bumps are already covered by ci.yml; the action also refuses to run
    # for bot actors unless they are allow-listed, which failed every dependabot PR.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the
            working directory, and CLAUDE.md describes the project — read it first.

            Context that matters here:
            - Static photography portfolio: plain HTML/CSS/JS, no framework, no build
              step. Anything that introduces a bundler or a runtime dependency is a
              significant change, not a detail.
            - `js/` is native ES modules loaded with `<script type="module">`;
              `image-tools/` and `scripts/` are CommonJS Node scripts. Don't mix them.
            - `js/gallery-data.json` is generated by `image-tools/generate-gallery.js`.
              Hand-edits to it are a bug. If images changed, the manifest and the files
              under `images/optimized/` must have been regenerated and committed.
            - Lint, manifest integrity, Playwright, and Lighthouse already run in
              `.github/workflows/ci.yml`. Don't re-report what those catch — focus on
              what a linter can't see.

            What to look for, in priority order:
            1. Bugs and broken behaviour, especially in the lightbox state machine
               (stale-request guard in `js/lightbox.js`) and the gallery render path.
            2. Accessibility and semantics in `index.html` (alt text, focus handling,
               keyboard navigation, ARIA on the lightbox).
            3. Performance regressions in how images are loaded — srcset/sizes,
               `loading="lazy"`, layout shift from missing width/height.
            4. Anything that would break on GitHub Pages (absolute paths, case-sensitive
               filenames, non-ASCII asset paths).

            Be specific and concrete. Skip style nits and praise. If the diff is fine,
            say so in one line rather than inventing findings.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues tied to specific lines.
            Only post GitHub comments — do not emit review text as chat messages.

          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
